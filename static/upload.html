<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识文档上传</title>
    <link rel="stylesheet" href="/common.css">
    <style>
        .upload-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            align-items: start;
        }
        .upload-grid.has-split {
            grid-template-columns: 1fr 1fr;
        }
        .file-drop {
            position: relative;
            border: 1.5px dashed var(--ke-border-strong);
            border-radius: var(--ke-radius);
            padding: 36px 20px;
            text-align: center;
            cursor: pointer;
            background: var(--ke-surface);
            transition: border-color 0.15s, background-color 0.15s;
        }
        .file-drop:hover,
        .file-drop.is-dragover {
            border-color: var(--ke-primary);
            background: var(--ke-primary-soft);
        }
        .file-drop input[type="file"] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .file-drop-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            border-radius: 10px;
            background: var(--ke-primary-soft);
            color: var(--ke-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
        }
        .file-drop-text {
            color: var(--ke-text-secondary);
            font-size: var(--ke-font-base);
        }
        .file-drop-name {
            margin-top: 10px;
            color: var(--ke-primary);
            font-weight: 550;
            word-break: break-all;
            font-size: 13px;
        }
        .progress-container {
            display: none;
            margin-top: 16px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--ke-border);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--ke-primary);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            text-align: center;
            margin-top: 8px;
            color: var(--ke-text-secondary);
            font-size: var(--ke-font-base);
        }
        .result {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: var(--ke-radius-sm);
            display: none;
            border: 1px solid transparent;
        }
        .result.success {
            display: block;
            background: var(--ke-success-soft);
            color: var(--ke-success);
            border-color: #b7e0cb;
        }
        .result.error {
            display: block;
            background: var(--ke-danger-soft);
            color: var(--ke-danger);
            border-color: #f0b4ae;
        }
        .result-title {
            font-weight: 600;
            margin-bottom: 6px;
        }
        .result-content {
            font-size: var(--ke-font-base);
            line-height: 1.6;
        }
        .split-form {
            display: none;
        }
        .split-form.is-visible {
            display: block;
        }
        .table-split-notice {
            display: none;
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: var(--ke-radius-sm);
            border: 1px solid #b7d4ef;
            background: #eef6fc;
            color: var(--ke-text-secondary);
            font-size: var(--ke-font-base);
            line-height: 1.6;
        }
        .table-split-notice.is-visible {
            display: block;
        }
        .table-split-notice strong {
            color: var(--ke-text);
        }
        @media (max-width: 900px) {
            .upload-grid.has-split {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-page">
        <header class="app-nav">
            <div class="app-brand">
                <span class="brand-mark">KE</span>
                <h1>知识文档上传</h1>
            </div>
            <nav class="app-nav-links" aria-label="页面导航">
                <a href="/upload.html" class="nav-link is-active">上传文档</a>
                <a href="/document.html" class="nav-link">文档管理</a>
                <a href="/chat.html" class="nav-link">AI 对话</a>
            </nav>
        </header>

        <main class="app-main">
            <div class="upload-grid" id="uploadGrid">
                <section class="panel">
                    <h2 class="panel-title">上传文件</h2>
                    <form id="uploadForm">
                        <div class="form-group">
                            <label>选择文件 *</label>
                            <div class="file-drop" id="fileWrapper">
                                <input type="file" id="file" name="file" required>
                                <div class="file-drop-icon">+</div>
                                <div class="file-drop-text">点击或拖拽文件到此处</div>
                                <div class="file-drop-name" id="fileName"></div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="title">文档标题 *</label>
                            <input type="text" id="title" name="title" placeholder="请输入文档标题" required>
                        </div>

                        <div class="form-group">
                            <label for="description">文档描述 *</label>
                            <input type="text" id="description" name="description" placeholder="请输入文档描述" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block" id="uploadBtn">开始上传</button>
                    </form>

                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-text" id="progressText">0%</div>
                    </div>

                    <div class="result" id="result">
                        <div class="result-title" id="resultTitle"></div>
                        <div class="result-content" id="resultContent"></div>
                    </div>
                </section>

                <section class="panel split-form" id="splitForm">
                    <h2 class="panel-title">文档切片设置</h2>
                    <form id="splitConfigForm">
                        <input type="hidden" id="documentId" name="documentId">

                        <div class="table-split-notice" id="tableSplitNotice">
                            <strong>表格文件固定处理：</strong>XLSX / CSV 会按「首行表头 + 逐行键值对」切分，每行生成一个分段。无需也不支持选择 LENGTH / TITLE 等切分方式。
                        </div>

                        <div id="splitParamsPanel">
                            <div class="form-group">
                                <label for="splitType">切片方式 *</label>
                                <select id="splitType" name="splitType" required>
                                    <option value="">请选择切片方式</option>
                                    <option value="LENGTH">按长度切分 (LENGTH)</option>
                                    <option value="TITLE">按标题切分 (TITLE)</option>
                                    <option value="REGEX">按正则切分 (REGEX)</option>
                                    <option value="SMART">智能切分 (SMART)</option>
                                    <option value="SEPARATOR">按分隔符切分 (SEPARATOR)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="chunkSize">最大分段长度 *</label>
                                <input type="number" id="chunkSize" name="chunkSize" placeholder="例如：500" min="1" required>
                                <div class="param-hint">所有切分方式都需要此参数</div>
                            </div>

                            <div class="param-group" id="overlapGroup">
                                <div class="form-group">
                                    <label for="overlap">分段重叠长度</label>
                                    <input type="number" id="overlap" name="overlap" placeholder="例如：50" min="0">
                                    <div class="param-hint">按长度切分、按标题切分需要</div>
                                </div>
                            </div>

                            <div class="param-group" id="titleLevelGroup">
                                <div class="form-group">
                                    <label for="titleLevel">标题级数</label>
                                    <input type="number" id="titleLevel" name="titleLevel" placeholder="例如：3" min="1" max="6">
                                    <div class="param-hint">按标题切分需要，范围 1-6</div>
                                </div>
                            </div>

                            <div class="param-group" id="regexGroup">
                                <div class="form-group">
                                    <label for="regex">正则表达式</label>
                                    <input type="text" id="regex" name="regex" placeholder="例如：\n\n+">
                                    <div class="param-hint">按正则切分需要</div>
                                </div>
                            </div>

                            <div class="param-group" id="separatorGroup">
                                <div class="form-group">
                                    <label for="separator">分隔符</label>
                                    <input type="text" id="separator" name="separator" placeholder="例如：\n\n">
                                    <div class="param-hint">按分隔符切分需要</div>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success btn-block" id="splitBtn">开始切片</button>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <script>
        const fileInput = document.getElementById('file');
        const fileName = document.getElementById('fileName');
        const fileWrapper = document.getElementById('fileWrapper');
        const uploadForm = document.getElementById('uploadForm');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const result = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultContent = document.getElementById('resultContent');
        const uploadGrid = document.getElementById('uploadGrid');
        const splitFormEl = document.getElementById('splitForm');
        const tableSplitNotice = document.getElementById('tableSplitNotice');
        const splitParamsPanel = document.getElementById('splitParamsPanel');
        const TABLE_SPLIT_DEFAULTS = { splitType: 'LENGTH', chunkSize: '500', overlap: '0' };
        let pendingSplitFileName = '';
        let isTableSplitMode = false;

        function getFileExtension(fileName) {
            if (!fileName) return '';
            const idx = fileName.lastIndexOf('.');
            return idx >= 0 ? fileName.substring(idx + 1).toLowerCase() : '';
        }

        function isTableFile(fileName) {
            const ext = getFileExtension(fileName);
            return ext === 'xlsx' || ext === 'xls' || ext === 'csv';
        }

        function applySplitUiMode(fileName) {
            isTableSplitMode = isTableFile(fileName);
            tableSplitNotice.classList.toggle('is-visible', isTableSplitMode);
            splitParamsPanel.style.display = isTableSplitMode ? 'none' : 'block';

            const splitTypeEl = document.getElementById('splitType');
            const chunkSizeEl = document.getElementById('chunkSize');
            if (isTableSplitMode) {
                splitTypeEl.value = TABLE_SPLIT_DEFAULTS.splitType;
                chunkSizeEl.value = TABLE_SPLIT_DEFAULTS.chunkSize;
                document.getElementById('overlap').value = TABLE_SPLIT_DEFAULTS.overlap;
                document.getElementById('titleLevel').value = '';
                document.getElementById('regex').value = '';
                document.getElementById('separator').value = '';
                updateParamVisibility();
            }
        }

        function showSplitPanel(visible) {
            splitFormEl.classList.toggle('is-visible', visible);
            uploadGrid.classList.toggle('has-split', visible);
            splitFormEl.style.display = visible ? 'block' : 'none';
            if (visible) {
                applySplitUiMode(pendingSplitFileName);
            } else {
                isTableSplitMode = false;
                pendingSplitFileName = '';
                tableSplitNotice.classList.remove('is-visible');
                splitParamsPanel.style.display = 'block';
            }
        }

        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                const file = this.files[0];
                const fullName = file.name;
                fileName.textContent = fullName;
                const lastDotIdx = fullName.lastIndexOf('.');
                const baseName = lastDotIdx > 0 ? fullName.substring(0, lastDotIdx) : fullName;
                const titleInput = document.getElementById('title');
                const descInput = document.getElementById('description');
                if (!titleInput.value.trim()) {
                    titleInput.value = baseName;
                }
                if (!descInput.value.trim()) {
                    descInput.value = baseName;
                }
            }
        });

        fileWrapper.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileWrapper.classList.add('is-dragover');
        });

        fileWrapper.addEventListener('dragleave', () => {
            fileWrapper.classList.remove('is-dragover');
        });

        fileWrapper.addEventListener('drop', (e) => {
            e.preventDefault();
            fileWrapper.classList.remove('is-dragover');

            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                fileInput.files = e.dataTransfer.files;
                const fullName = e.dataTransfer.files[0].name;
                fileName.textContent = fullName;
                const lastDotIdx = fullName.lastIndexOf('.');
                const baseName = lastDotIdx > 0 ? fullName.substring(0, lastDotIdx) : fullName;
                const titleInput = document.getElementById('title');
                const descInput = document.getElementById('description');
                if (!titleInput.value.trim()) {
                    titleInput.value = baseName;
                }
                if (!descInput.value.trim()) {
                    descInput.value = baseName;
                }
            }
        });

        uploadForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const file = fileInput.files[0];
            if (!file) {
                showResult('error', '请选择要上传的文件');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);

            result.className = 'result';
            progressContainer.style.display = 'block';
            uploadBtn.disabled = true;
            uploadBtn.textContent = '上传中...';

            try {
                const xhr = new XMLHttpRequest();

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        progressFill.style.width = percent + '%';
                        progressText.textContent = percent + '%';
                    }
                });

                xhr.addEventListener('load', () => {
                    progressContainer.style.display = 'none';
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = '开始上传';

                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        pendingSplitFileName = file.name;
                        showResult('success', '上传成功！', `
                            <strong>文档ID：</strong>${response.docId}<br>
                            <strong>文档标题：</strong>${response.docTitle}<br>
                            <strong>版本ID：</strong>${response.currentVersionId ?? '-'}<br>
                            <strong>状态：</strong>${response.status}
                        `);
                        document.getElementById('documentId').value = response.docId;
                        showSplitPanel(true);
                        uploadForm.reset();
                        fileName.textContent = '';
                    } else {
                        let errorMsg = '服务器返回错误：' + xhr.status;
                        try {
                            const respText = xhr.responseText.trim();
                            if (respText) errorMsg = respText;
                        } catch (err) {}
                        showResult('error', '上传失败', errorMsg);
                    }
                });

                xhr.addEventListener('error', () => {
                    progressContainer.style.display = 'none';
                    uploadBtn.disabled = false;
                    uploadBtn.textContent = '开始上传';
                    showResult('error', '上传失败', '网络请求出错，请检查网络连接');
                });

                xhr.open('POST', '/api/document/upload');
                xhr.send(formData);

            } catch (error) {
                progressContainer.style.display = 'none';
                uploadBtn.disabled = false;
                uploadBtn.textContent = '开始上传';
                showResult('error', '上传失败', error.message);
            }
        });

        function showResult(type, title, content = '') {
            result.className = 'result ' + type;
            resultTitle.textContent = title;
            resultContent.innerHTML = content;
        }

        const splitTypeSelect = document.getElementById('splitType');
        const splitConfigForm = document.getElementById('splitConfigForm');
        const splitBtn = document.getElementById('splitBtn');

        function updateParamVisibility() {
            const splitType = splitTypeSelect.value;
            document.getElementById('overlapGroup').classList.remove('show');
            document.getElementById('titleLevelGroup').classList.remove('show');
            document.getElementById('regexGroup').classList.remove('show');
            document.getElementById('separatorGroup').classList.remove('show');

            if (splitType === 'LENGTH' || splitType === 'TITLE') {
                document.getElementById('overlapGroup').classList.add('show');
            }
            if (splitType === 'TITLE') {
                document.getElementById('titleLevelGroup').classList.add('show');
            }
            if (splitType === 'REGEX') {
                document.getElementById('regexGroup').classList.add('show');
            }
            if (splitType === 'SEPARATOR') {
                document.getElementById('separatorGroup').classList.add('show');
            }
        }

        splitTypeSelect.addEventListener('change', updateParamVisibility);

        splitConfigForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const documentId = document.getElementById('documentId').value;
            let splitType = document.getElementById('splitType').value;
            let chunkSize = document.getElementById('chunkSize').value;
            let overlap = document.getElementById('overlap').value || 0;
            let titleLevel = document.getElementById('titleLevel').value || '';
            let regex = document.getElementById('regex').value || '';
            let separator = document.getElementById('separator').value || '';
            let splitModeLabel = splitType;

            if (isTableSplitMode) {
                splitType = TABLE_SPLIT_DEFAULTS.splitType;
                chunkSize = TABLE_SPLIT_DEFAULTS.chunkSize;
                overlap = TABLE_SPLIT_DEFAULTS.overlap;
                titleLevel = '';
                regex = '';
                separator = '';
                splitModeLabel = '表格固定处理（逐行键值对）';
            } else {
                if (!splitType) {
                    showResult('error', '请选择切片方式');
                    return;
                }
                if (!chunkSize || chunkSize < 1) {
                    showResult('error', '请输入有效的最大分段长度');
                    return;
                }
            }

            const params = new URLSearchParams();
            params.append('splitType', splitType);
            params.append('chunkSize', chunkSize);
            params.append('overlap', overlap);
            params.append('titleLevel', titleLevel);
            params.append('regex', regex);
            params.append('separator', separator);

            splitBtn.disabled = true;
            splitBtn.textContent = '切片中...';

            try {
                const response = await fetch(`/api/document/split/${documentId}?${params.toString()}`, {
                    method: 'POST'
                });

                if (response.ok) {
                    const resultData = await response.json();
                    showResult('success', '切片完成！', `
                        <strong>文档ID：</strong>${documentId}<br>
                        <strong>切片方式：</strong>${splitModeLabel}<br>
                        <strong>切片数量：</strong>${resultData} 个片段
                    `);
                    showSplitPanel(false);
                    setTimeout(() => { window.location.href = '/document.html'; }, 1500);
                } else {
                    const errorText = await response.text();
                    showResult('error', '切片失败', errorText || '服务器返回错误：' + response.status);
                }
            } catch (error) {
                showResult('error', '切片失败', error.message);
            } finally {
                splitBtn.disabled = false;
                splitBtn.textContent = '开始切片';
            }
        });
    </script>
</body>
</html>
